# Supabase CLI config for local development.
# https://supabase.com/docs/guides/local-development/cli/config
#
# Migrations are the single source in packages/db/migrations/; supabase/migrations
# is a symlink to it, so `supabase db reset` applies them and then seeds from
# supabase/seed.sql (generated by `pnpm --filter @studiobook/web db:seed-sql`).

project_id = "studiobook"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Local email capture — outbound email during dev lands in Inbucket, not a real
# inbox. Production email goes through Cloudflare Email (see lib/notifications/).
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
