name: deploy-preview

# Ephemeral per-PR preview deploy of apps/web, dispatched by the SHIP
# orchestrator's deploying stage via workflow_dispatch (wiring lives in
# ship.yml at the repo root).
#
# On a successful deploy this workflow creates a GitHub Deployment + a
# `success` deployment status carrying { pr_number, workerName } in the payload
# and the live preview URL as `environment_url`, which routes the orchestrator
# back to resume the pipeline -> QA smoke test.
#
#   action=deploy : build (OpenNext) + deploy a *.workers.dev Worker.
#   action=delete : tear down the preview Worker on PR merge/close.
#
# Preview environments share ONE Cloudflare D1 database (there is no ephemeral
# per-PR database) — migrations are applied and the demo dataset is reseeded
# fresh before every deploy, so each preview always starts from a known state.
# RESEND_API_KEY is set as a Worker secret after deploy.
#
# NOTE: this file must live on the DEFAULT branch for workflow_dispatch to
# resolve it; ship.yml is read at the PR head SHA.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy | delete"
        required: true
        type: string
      worker_name:
        description: "Per-PR Cloudflare Worker name"
        required: true
        type: string
      config_file:
        description: "Path to the wrangler config (repo-root relative)"
        required: true
        type: string
      env_name:
        description: "Deployment environment name"
        required: true
        type: string
      ref:
        description: "Branch to deploy"
        required: true
        type: string
      account_subdomain:
        description: "Account workers.dev subdomain"
        required: true
        type: string
      pr_number:
        description: "PR number (deploy only)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    name: ${{ inputs.action }} preview ${{ inputs.worker_name }}
    # Ubicloud dedicated runner: the pipeline's deploying stage waits on this
    # preview build, so a shared-queue wait here stalls the run the same way a
    # queued check_suite does. Matches the ship-platform deploy-preview pattern.
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- DELETE: tear down the preview Worker (best-effort, no callback) ---
      - name: Delete preview worker
        if: inputs.action == 'delete'
        working-directory: apps/web
        run: |
          CONFIG="$(basename "${{ inputs.config_file }}")"
          pnpm exec wrangler delete -c "$CONFIG" --name "${{ inputs.worker_name }}" || true

      # --- DEPLOY: migrate + reseed the shared D1 database, build, deploy, set secrets ---
      # The config file's database_id is a placeholder (wrangler trusts any non-empty
      # database_id in a matching config entry instead of resolving it by name), so we
      # resolve the real UUID via the account-level `d1 list` API — which never reads
      # local config — and patch it in before any command that reads the config.
      - name: Resolve the preview D1 database ID
        if: inputs.action == 'deploy'
        working-directory: apps/web
        run: |
          CONFIG="$(basename "${{ inputs.config_file }}")"
          DB_ID="$(pnpm exec wrangler d1 list --json | jq -r '.[] | select(.name == "studiobook-preview") | .uuid')"
          if [ -z "$DB_ID" ]; then
            echo "Could not find a D1 database named 'studiobook-preview' in this account" >&2
            exit 1
          fi
          sed -i "s/REPLACE_ME_WITH_A_REAL_D1_DATABASE_ID/$DB_ID/" "$CONFIG"

      - name: Reseed the shared preview D1 database
        if: inputs.action == 'deploy'
        working-directory: apps/web
        run: |
          CONFIG="$(basename "${{ inputs.config_file }}")"
          pnpm exec wrangler d1 migrations apply studiobook-preview --remote -c "$CONFIG"
          pnpm exec wrangler d1 execute studiobook-preview --remote -c "$CONFIG" --command "
            delete from notification_outbox;
            delete from invoice_line_items;
            delete from invoices;
            delete from bookings;
            delete from class_sessions;
            delete from class_types;
            delete from members;
            delete from studio_settings;
            delete from studios;
          "
          pnpm exec wrangler d1 execute studiobook-preview --remote -c "$CONFIG" --file=seed.sql

      - name: Build apps/web for Cloudflare (OpenNext)
        if: inputs.action == 'deploy'
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ inputs.worker_name }}.${{ inputs.account_subdomain }}.workers.dev
        run: pnpm --filter @studiobook/web build:cf

      - name: Deploy preview worker
        if: inputs.action == 'deploy'
        id: deploy
        working-directory: apps/web
        run: |
          CONFIG="$(basename "${{ inputs.config_file }}")"
          pnpm exec wrangler deploy -c "$CONFIG" --name "${{ inputs.worker_name }}"
          echo "url=https://${{ inputs.worker_name }}.${{ inputs.account_subdomain }}.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Set Worker runtime secrets
        if: inputs.action == 'deploy'
        working-directory: apps/web
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          CONFIG="$(basename "${{ inputs.config_file }}")"
          printf '%s' "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY -c "$CONFIG" --name "${{ inputs.worker_name }}"

      - name: Signal deployment status to SHIP
        if: inputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          ENV_NAME: ${{ inputs.env_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          WORKER_NAME: ${{ inputs.worker_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHA="$(git rev-parse HEAD)"
          DEP_ID="$(jq -n \
            --arg ref "$SHA" \
            --arg env "$ENV_NAME" \
            --arg pr "$PR_NUMBER" \
            --arg wn "$WORKER_NAME" \
            '{ref:$ref, environment:$env, auto_merge:false, required_contexts:[], description:"Studiobook preview environment", payload:{pr_number:$pr, workerName:$wn}}' \
            | gh api "repos/$REPO/deployments" --input - --jq .id)"
          gh api "repos/$REPO/deployments/$DEP_ID/statuses" \
            -f state=success \
            -f environment_url="$PREVIEW_URL" \
            -f log_url="$RUN_URL" \
            -f description="Preview deployed"
