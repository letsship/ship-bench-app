name: deploy-preview

# Ephemeral per-PR preview deploy of apps/web, dispatched by the SHIP
# orchestrator's deploying stage via workflow_dispatch (wiring lives in
# ship.yml at the repo root).
#
# On a successful deploy this workflow creates a GitHub Deployment + a
# `success` deployment status carrying { pr_number, workerName } in the payload
# and the live preview URL as `environment_url`, which routes the orchestrator
# back to resume the pipeline -> QA smoke test.
#
#   action=deploy : build (OpenNext) + deploy a *.workers.dev Worker.
#   action=delete : tear down the preview Worker on PR merge/close.
#
# Preview environments share ONE Supabase project but are ISOLATED per schema:
# each PR maps (by number) to one schema from a pre-exposed pool (bench_1..N),
# reseeded fresh before every deploy, so concurrent previews never share mutable
# data. The Supabase URL + publishable key are injected at build time (inlined),
# and SUPABASE_SECRET_KEY + RESEND_API_KEY + SUPABASE_SCHEMA are Worker secrets
# set after deploy. Requires secret SUPABASE_DB_URL (a direct/pooler psql URL) +
# a one-time `provision-pool.sh` run to expose the pool.
#
# NOTE: this file must live on the DEFAULT branch for workflow_dispatch to
# resolve it; ship.yml is read at the PR head SHA.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy | delete"
        required: true
        type: string
      worker_name:
        description: "Per-PR Cloudflare Worker name"
        required: true
        type: string
      config_file:
        description: "Path to the wrangler config (repo-root relative)"
        required: true
        type: string
      env_name:
        description: "Deployment environment name"
        required: true
        type: string
      ref:
        description: "Branch to deploy"
        required: true
        type: string
      account_subdomain:
        description: "Account workers.dev subdomain"
        required: true
        type: string
      pr_number:
        description: "PR number (deploy only)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    name: ${{ inputs.action }} preview ${{ inputs.worker_name }}
    # Ubicloud dedicated runner: the pipeline's deploying stage waits on this
    # preview build, so a shared-queue wait here stalls the run the same way a
    # queued check_suite does. Matches the ship-platform deploy-preview pattern.
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- DELETE: tear down the preview Worker (best-effort, no callback) ---
      - name: Delete preview worker
        if: inputs.action == 'delete'
        working-directory: apps/web
        run: |
          CONFIG="$(basename "${{ inputs.config_file }}")"
          pnpm exec wrangler delete -c "$CONFIG" --name "${{ inputs.worker_name }}" || true

      # --- DEPLOY: isolate this PR's data, build, deploy, set secrets ---
      - name: Reseed this PR's isolated schema
        if: inputs.action == 'deploy'
        id: schema
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          exec > >(tee -a /tmp/deploy-err.log) 2>&1
          echo "::group::reseed schema"
          POOL=12
          PR="${{ inputs.pr_number }}"
          # Deterministic schema per PR from the pre-exposed pool (bench_1..bench_POOL).
          IDX=$(( ( ${PR:-0} % POOL ) + 1 ))
          SCHEMA="bench_${IDX}"
          echo "schema=$SCHEMA" >> "$GITHUB_OUTPUT"
          bash packages/db/scripts/reseed-schema.sh "$SCHEMA"

      - name: Build apps/web for Cloudflare (OpenNext)
        if: inputs.action == 'deploy'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://${{ inputs.worker_name }}.${{ inputs.account_subdomain }}.workers.dev
        run: |
          exec > >(tee -a /tmp/deploy-err.log) 2>&1
          echo "::group::build:cf"
          pnpm --filter @studiobook/web build:cf

      # A migration task (e.g. Supabase -> D1) ships a D1 binding with a
      # placeholder database_id; without a real one, wrangler deploy fails with
      # "binding DB must have a valid database_id [10021]". Point the binding at
      # the shared preview D1, reset it, apply the solution's migrations, and seed
      # via the solution's own emitter — so a correct D1 migration is deployable +
      # QA-able. No-op when the config declares no D1 (the other tasks).
      - name: Provision D1 for preview (when the config declares one)
        if: inputs.action == 'deploy'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          exec > >(tee -a /tmp/deploy-err.log) 2>&1
          echo "::group::provision D1"
          set -e
          CONFIG="$(basename "${{ inputs.config_file }}")"
          if ! grep -q '"d1_databases"' "$CONFIG"; then
            echo "no D1 binding in $CONFIG — skipping D1 provisioning"
            exit 0
          fi
          DB_NAME="studiobook-preview"
          DB_ID="9a1d7061-5c59-43e3-a3fb-751170947225"
          # Point every d1 binding at the shared preview DB (agent shipped a placeholder).
          sed -i "s#\"database_id\": *\"[^\"]*\"#\"database_id\": \"$DB_ID\"#g" "$CONFIG"
          sed -i "s#\"database_name\": *\"[^\"]*\"#\"database_name\": \"$DB_NAME\"#g" "$CONFIG"
          echo "D1 binding -> $DB_NAME ($DB_ID)"
          # Reset: drop every user table (incl. d1_migrations) so each preview
          # starts clean and migrations re-apply from scratch.
          pnpm exec wrangler d1 execute "$DB_NAME" --remote --json --command \
            "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%'" \
            > /tmp/d1-tables.json || echo '[]' > /tmp/d1-tables.json
          node -e 'const j=require("/tmp/d1-tables.json");const rows=(Array.isArray(j)?j[0]:j)?.results||[];const s=rows.map(r=>`DROP TABLE IF EXISTS \"${r.name}\";`).join("\n");require("fs").writeFileSync("/tmp/d1-drop.sql",s);console.log(`reset: dropping ${rows.length} table(s)`)'
          if [ -s /tmp/d1-drop.sql ]; then
            pnpm exec wrangler d1 execute "$DB_NAME" --remote --yes --file /tmp/d1-drop.sql
          fi
          # Apply the solution's migrations, then seed via the solution's emitter.
          # NOTE: `d1 migrations apply` has NO --yes flag (only `d1 execute` does);
          # it auto-proceeds in CI's non-interactive shell.
          pnpm exec wrangler d1 migrations apply "$DB_NAME" --remote -c "$CONFIG"
          # Seed: the solution's emitter WRITES a Postgres seed to supabase/seed.sql
          # (it prints only a log line to stdout — do NOT capture stdout as SQL).
          # Regenerate it (a migration solution deletes the committed copy), then
          # adapt Postgres -> SQLite for D1 by dropping the `public.` schema
          # qualifier (SQLite has no schemas), and load it.
          if [ -f scripts/emit-seed-sql.ts ]; then
            pnpm exec tsx scripts/emit-seed-sql.ts
            if [ -f ../../supabase/seed.sql ]; then
              sed 's/into public\./into /g' ../../supabase/seed.sql > /tmp/d1-seed.sql
              pnpm exec wrangler d1 execute "$DB_NAME" --remote --yes --file /tmp/d1-seed.sql
              echo "D1 seeded ($(wc -l < /tmp/d1-seed.sql) lines)"
            fi
          fi
          echo "D1 provisioned"

      - name: Deploy preview worker
        if: inputs.action == 'deploy'
        id: deploy
        working-directory: apps/web
        run: |
          exec > >(tee -a /tmp/deploy-err.log) 2>&1
          echo "::group::wrangler deploy"
          CONFIG="$(basename "${{ inputs.config_file }}")"
          pnpm exec wrangler deploy -c "$CONFIG" --name "${{ inputs.worker_name }}"
          echo "url=https://${{ inputs.worker_name }}.${{ inputs.account_subdomain }}.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Set Worker runtime secrets
        if: inputs.action == 'deploy'
        working-directory: apps/web
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_SCHEMA: ${{ steps.schema.outputs.schema }}
        run: |
          CONFIG="$(basename "${{ inputs.config_file }}")"
          printf '%s' "$SUPABASE_SECRET_KEY" | pnpm exec wrangler secret put SUPABASE_SECRET_KEY -c "$CONFIG" --name "${{ inputs.worker_name }}"
          printf '%s' "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY -c "$CONFIG" --name "${{ inputs.worker_name }}"
          printf '%s' "$SUPABASE_SCHEMA" | pnpm exec wrangler secret put SUPABASE_SCHEMA -c "$CONFIG" --name "${{ inputs.worker_name }}"

      - name: Signal deployment status to SHIP
        if: inputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          ENV_NAME: ${{ inputs.env_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          WORKER_NAME: ${{ inputs.worker_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHA="$(git rev-parse HEAD)"
          DEP_ID="$(jq -n \
            --arg ref "$SHA" \
            --arg env "$ENV_NAME" \
            --arg pr "$PR_NUMBER" \
            --arg wn "$WORKER_NAME" \
            '{ref:$ref, environment:$env, auto_merge:false, required_contexts:[], description:"Studiobook preview environment", payload:{pr_number:$pr, workerName:$wn}}' \
            | gh api "repos/$REPO/deployments" --input - --jq .id)"
          gh api "repos/$REPO/deployments/$DEP_ID/statuses" \
            -f state=success \
            -f environment_url="$PREVIEW_URL" \
            -f log_url="$RUN_URL" \
            -f description="Preview deployed"

      # A FAILED preview deploy otherwise signals nothing, so SHIP's deploy stage
      # waits out its full timeout and escalates the mission on a bare timeout with
      # no cause. Signal state=error with the captured failure tail so SHIP fast-
      # fails WITH the actual reason: it surfaces in the deploy retry-reason + the
      # coding agent's feedback, and is readable via inspect-pipeline. The key error
      # line goes in `description` (SHIP reads that as the error; GitHub caps it at
      # ~140 chars), the run link in `log_url`.
      - name: Signal deployment FAILURE to SHIP
        if: failure() && inputs.action == 'deploy'
        # `set +e`: GitHub's default `bash -e` aborts the step the moment a
        # command in a `$(...)` returns non-zero — e.g. a `grep` that finds no
        # match — BEFORE the fallbacks run, so the step failed and SHIP never got
        # the callback (it then stalled the full deploy timeout). Never abort here:
        # this step MUST always post the error status.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_NAME: ${{ inputs.env_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          WORKER_NAME: ${{ inputs.worker_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          ERRLINE="$(grep -iE 'error|fatal|not found|cannot|failed|refus|exception|10021' /tmp/deploy-err.log 2>/dev/null | grep -viE '^\s*(warn|note)' | tail -1 | tr -s ' ' | head -c 135)"
          [ -z "$ERRLINE" ] && ERRLINE="$(tail -3 /tmp/deploy-err.log 2>/dev/null | tr '\n' ' ' | tr -s ' ' | head -c 135)"
          [ -z "$ERRLINE" ] && ERRLINE="preview deploy failed (see run log)"
          SHA="$(git rev-parse HEAD)"
          DEP_ID="$(jq -n \
            --arg ref "$SHA" \
            --arg env "$ENV_NAME" \
            --arg pr "$PR_NUMBER" \
            --arg wn "$WORKER_NAME" \
            '{ref:$ref, environment:$env, auto_merge:false, required_contexts:[], description:"Studiobook preview environment", payload:{pr_number:$pr, workerName:$wn}}' \
            | gh api "repos/$REPO/deployments" --input - --jq .id)"
          gh api "repos/$REPO/deployments/$DEP_ID/statuses" \
            -f state=error \
            -f log_url="$RUN_URL" \
            -f description="deploy failed: $ERRLINE"
