version: 1

agents:
  planner:
    harness: claude-code
    model: opus
  builder:
    harness: claude-code
    model: haiku
  reviewer:
    harness: claude-code
    model: opus
  qa:
    harness: claude-code
    model: opus

deployments:
  preview:
    type: cloudflare-worker
    workflow: deploy-preview.yml
    configFile: apps/web/wrangler.preview.jsonc
    envName: preview
    appName: studiobook
    accountSubdomain: ship-ai
    skipDeployPaths:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "**/__tests__/**"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.spec.ts"
      - "apps/web/e2e/**"
